<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel Administrativo — Viagens</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel-2:#334155; --text:#e2e8f0;
    --muted:#94a3b8; --primary:#3b82f6; --primary-2:#2563eb;
    --success:#10b981; --warning:#f59e0b; --danger:#ef4444;
    --radius:10px; --shadow:0 4px 20px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  button{cursor:pointer;font-family:inherit}
  input,select,textarea{font-family:inherit}
  #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
  .login-card{background:var(--panel);padding:2rem;border-radius:var(--radius);box-shadow:var(--shadow);width:100%;max-width:380px}
  .login-card h1{font-size:1.25rem;margin-bottom:.25rem}
  .login-card p{color:var(--muted);font-size:.85rem;margin-bottom:1.5rem}
  .field{margin-bottom:1rem}
  .field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.35rem}
  .field input,.field select,.field textarea{width:100%;padding:.65rem .75rem;background:var(--panel-2);border:1px solid #475569;border-radius:8px;color:var(--text);font-size:.9rem}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary)}
  .btn{padding:.65rem 1rem;border:none;border-radius:8px;font-weight:600;font-size:.9rem;transition:.15s}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-2)}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid #475569}
  .btn-ghost:hover{color:var(--text);border-color:var(--muted)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-success{background:var(--success);color:#fff}
  .btn-sm{padding:.4rem .7rem;font-size:.78rem}
  .btn-block{width:100%}
  .error-msg{color:var(--danger);font-size:.8rem;margin-top:.5rem;min-height:1.1rem;word-break:break-word}
  #app{display:none;min-height:100vh}
  .layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  aside{background:var(--panel);border-right:1px solid #334155;padding:1.25rem 0;display:flex;flex-direction:column}
  .brand{padding:0 1.25rem 1rem;font-weight:700;font-size:1.05rem;border-bottom:1px solid #334155;margin-bottom:.75rem}
  .brand small{display:block;font-weight:400;font-size:.7rem;color:var(--muted);margin-top:.2rem}
  nav{display:flex;flex-direction:column;gap:.2rem;padding:0 .5rem;flex:1}
  .nav-item{display:flex;align-items:center;gap:.6rem;padding:.6rem .75rem;border-radius:8px;color:var(--muted);background:transparent;border:none;text-align:left;font-size:.88rem;width:100%}
  .nav-item:hover{background:var(--panel-2);color:var(--text)}
  .nav-item.active{background:var(--primary);color:#fff}
  .nav-item .icon{width:18px;text-align:center}
  .user-box{padding:1rem 1.25rem 0;border-top:1px solid #334155;margin-top:.75rem;font-size:.78rem}
  .user-box .role{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
  .user-box button{margin-top:.6rem;width:100%}
  main{padding:1.5rem 2rem;overflow:auto}
  .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:.75rem}
  .page-header h2{font-size:1.35rem}
  .page-header .sub{color:var(--muted);font-size:.85rem;margin-top:.15rem}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}
  .card{background:var(--panel);border:1px solid #334155;border-radius:var(--radius);padding:1.1rem}
  .card .label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .card .value{font-size:1.6rem;font-weight:700;margin-top:.35rem}
  .card .value.success{color:var(--success)}
  .card .value.danger{color:var(--danger)}
  .card .value.warning{color:var(--warning)}
  .table-wrap{background:var(--panel);border:1px solid #334155;border-radius:var(--radius);overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th,td{padding:.7rem .9rem;text-align:left;border-bottom:1px solid #334155}
  th{background:var(--panel-2);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  tr:last-child td{border-bottom:none}
  .badge{display:inline-block;padding:.2rem .55rem;border-radius:999px;font-size:.7rem;font-weight:600}
  .badge.pending{background:#78350f;color:#fcd34d}
  .badge.confirmed{background:#065f46;color:#6ee7b7}
  .badge.cancelled{background:#7f1d1d;color:#fca5a5}
  .badge.paid{background:#065f46;color:#6ee7b7}
  .badge.published{background:#1e3a8a;color:#93c5fd}
  .badge.unpublished{background:#374151;color:#9ca3af}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:1rem;z-index:50}
  .modal-backdrop.open{display:flex}
  .modal{background:var(--panel);border-radius:var(--radius);width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
  .modal-header{padding:1.1rem 1.25rem;border-bottom:1px solid #334155;display:flex;justify-content:space-between;align-items:center}
  .modal-header h3{font-size:1rem}
  .modal-body{padding:1.25rem}
  .modal-footer{padding:1rem 1.25rem;border-top:1px solid #334155;display:flex;justify-content:flex-end;gap:.5rem}
  .close-x{background:none;border:none;color:var(--muted);font-size:1.3rem;line-height:1}
  #toast-container{position:fixed;top:1rem;right:1rem;display:flex;flex-direction:column;gap:.5rem;z-index:100}
  .toast{padding:.75rem 1rem;border-radius:8px;font-size:.85rem;color:#fff;box-shadow:var(--shadow);animation:slide .2s ease}
  .toast.success{background:var(--success)}
  .toast.error{background:var(--danger)}
  .toast.info{background:var(--primary)}
  @keyframes slide{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
  .empty{text-align:center;padding:2rem;color:var(--muted);font-size:.85rem}
  .row-actions{display:flex;gap:.35rem;flex-wrap:wrap}
  .thumb{width:48px;height:32px;object-fit:cover;border-radius:4px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  .mobile-menu-btn{display:none;background:var(--panel-2);border:none;color:var(--text);padding:.5rem .7rem;border-radius:8px;margin-right:.5rem}
  @media(max-width:900px){
    .layout{grid-template-columns:1fr}
    aside{position:fixed;left:-260px;top:0;bottom:0;width:240px;z-index:40;transition:.2s}
    aside.open{left:0}
    main{padding:1rem}
    .form-row{grid-template-columns:1fr}
    .mobile-menu-btn{display:inline-flex}
  }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h1>Painel Administrativo</h1>
    <p>Acesse com suas credenciais autorizadas.</p>
    <form id="login-form">
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="login-email" required autocomplete="username" />
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="login-password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
      <div class="error-msg" id="login-error"></div>
    </form>
  </div>
</div>

<div id="app">
  <div class="layout">
    <aside id="sidebar">
      <div class="brand">Painel Viagens<small>Administração</small></div>
      <nav id="nav"></nav>
      <div class="user-box">
        <div id="user-email">—</div>
        <div class="role" id="user-role">—</div>
        <button class="btn btn-ghost btn-sm" id="logout-btn">Sair</button>
      </div>
    </aside>
    <main>
      <div class="page-header">
        <div style="display:flex;align-items:center">
          <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
          <div>
            <h2 id="page-title">Dashboard</h2>
            <div class="sub" id="page-sub">Visão geral</div>
          </div>
        </div>
        <div id="page-actions"></div>
      </div>
      <div id="view"></div>
    </main>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">—</h3>
      <button class="close-x" id="modal-close">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<div id="toast-container"></div>

<script>
/* =====================================================================
   CONFIGURAÇÃO
   ===================================================================== */
const SUPABASE_URL = 'https://xskuytsfwplrqhldwhhe.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhza3V5dHNmd3BscnFobGR3aGhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzMzg1NjIsImV4cCI6MjEwOTkxNDU2Mn0.yU582BL2vQRriWN4wiQLcQ07KiRjMJAOtnjPEykcwjc';
const BUCKET_IMAGES = 'trip-images';

/* =====================================================================
   PERMISSÕES POR ROLE
   ===================================================================== */
const ROLE_PERMISSIONS = {
  owner:       ['dashboard','trips','reservations','finance','reports','settings','manage_users'],
  admin:       ['dashboard','trips','reservations','finance','reports','settings'],
  financeiro:  ['dashboard','finance','reports'],
  visualizador:['dashboard','trips','reservations','reports'],
};

const MENU = [
  { key:'dashboard',    label:'Dashboard',      icon:'📊', title:'Dashboard',      sub:'Visão geral' },
  { key:'trips',        label:'Viagens',        icon:'✈️', title:'Viagens',        sub:'Gerenciar destinos' },
  { key:'reservations', label:'Reservas',       icon:'📋', title:'Reservas',       sub:'Solicitações de clientes' },
  { key:'finance',      label:'Financeiro',     icon:'💰', title:'Financeiro',     sub:'Entradas, despesas e saldo' },
  { key:'reports',      label:'Relatórios',     icon:'📈', title:'Relatórios',     sub:'Consultas e exportações' },
  { key:'settings',     label:'Configurações',  icon:'⚙️', title:'Configurações',  sub:'Painel e usuários' },
];

/* =====================================================================
   [CORREÇÃO CRÍTICA] Variável renomeada para 'sb'
   O CDN do Supabase declara window.supabase. Declarar 'const supabase'
   no escopo global causa: Identifier 'supabase' has already been declared.
   ===================================================================== */
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const state = { user:null, role:null, permissions:[], currentPage:'dashboard', data:{} };

/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = sel => document.querySelector(sel);
const fmtBRL = n => Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtDate = d => d ? new Date(d).toLocaleDateString('pt-BR') : '—';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  $('#toast-container').appendChild(el);
  setTimeout(()=>el.remove(), 4000);
}
function can(perm){ return state.permissions.includes(perm); }
function openModal(title, bodyHTML, footerHTML=''){
  $('#modal-title').textContent = title;
  $('#modal-body').innerHTML = bodyHTML;
  $('#modal-footer').innerHTML = footerHTML;
  $('#modal-backdrop').classList.add('open');
}
function closeModal(){ $('#modal-backdrop').classList.remove('open'); }
window.closeModal = closeModal;

$('#modal-close').onclick = closeModal;
$('#modal-backdrop').addEventListener('click', e=>{ if(e.target.id==='modal-backdrop') closeModal(); });

async function logActivity(action, description){
  try{
    await sb.from('activity_logs').insert({ user_id: state.user.id, action, description });
  }catch(e){ console.warn('log falhou:', e); }
}

/* =====================================================================
   LOGIN
   ===================================================================== */
$('#login-form').addEventListener('submit', async e=>{
  e.preventDefault();
  const errEl = $('#login-error');
  const btn = $('#login-btn');
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Entrando…';

  const email = $('#login-email').value.trim();
  const password = $('#login-password').value;

  try {
    console.log('[1/3] Autenticando...');
    const { data: authData, error: authError } = await sb.auth.signInWithPassword({ email, password });

    if (authError) {
      console.error('[1/3] authError:', authError);
      if (authError.message.includes('Invalid login')) {
        errEl.textContent = 'E-mail ou senha incorretos.';
      } else if (authError.message.includes('Email not confirmed')) {
        errEl.textContent = 'E-mail não confirmado. Confirme em Authentication → Users.';
      } else {
        errEl.textContent = 'Erro no login: ' + authError.message;
      }
      return;
    }
    console.log('[1/3] ok. user id:', authData.user.id);

    console.log('[2/3] Buscando role em admin_users...');
    const { data: adminRow, error: adminError } = await sb
      .from('admin_users')
      .select('role')
      .eq('user_id', authData.user.id)
      .maybeSingle();

    if (adminError) {
      console.error('[2/3] adminError:', adminError);
      errEl.textContent = 'Erro ao ler admin_users: ' + adminError.message +
        ' (verifique RLS e se a tabela tem a linha com user_id correto)';
      await sb.auth.signOut();
      return;
    }

    if (!adminRow) {
      console.error('[2/3] adminRow vazio. user_id consultado:', authData.user.id);
      errEl.textContent =
        'Usuário autenticado, mas NÃO está em admin_users. ' +
        'Insira: insert into admin_users(user_id,role) values (\'' +
        authData.user.id + '\',\'owner\');';
      await sb.auth.signOut();
      return;
    }

    console.log('[2/3] ok. role:', adminRow.role);
    const perms = ROLE_PERMISSIONS[adminRow.role];
    if (!perms) {
      errEl.textContent = 'Role desconhecida: "' + adminRow.role + '". Use owner/admin/financeiro/visualizador.';
      await sb.auth.signOut();
      return;
    }

    console.log('[3/3] Entrando no painel...');
    state.user = authData.user;
    state.role = adminRow.role;
    state.permissions = perms;

    $('#login-screen').style.display = 'none';
    $('#app').style.display = 'block';
    $('#user-email').textContent = authData.user.email;
    $('#user-role').textContent = adminRow.role;

    renderNav();
    navigate('dashboard');

  } catch (err) {
    console.error('Erro inesperado no login:', err);
    errEl.textContent = 'Erro inesperado: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
});

$('#logout-btn').addEventListener('click', async ()=>{
  await sb.auth.signOut();
  location.reload();
});

function renderNav(){
  const nav = $('#nav');
  nav.innerHTML = '';
  MENU.forEach(item=>{
    if(!can(item.key)) return;
    const btn = document.createElement('button');
    btn.className = 'nav-item' + (state.currentPage===item.key?' active':'');
    btn.innerHTML = `<span class="icon">${item.icon}</span> ${item.label}`;
    btn.onclick = ()=>{ navigate(item.key); $('#sidebar').classList.remove('open'); };
    nav.appendChild(btn);
  });
}

async function navigate(page){
  if(!can(page)){
    toast('Sem permissão para acessar este módulo.','error');
    page = 'dashboard';
  }
  state.currentPage = page;
  renderNav();
  const item = MENU.find(m=>m.key===page);
  $('#page-title').textContent = item.title;
  $('#page-sub').textContent = item.sub;
  $('#page-actions').innerHTML = '';
  $('#view').innerHTML = '<div class="empty">Carregando…</div>';

  try{
    if(page==='dashboard')    await renderDashboard();
    if(page==='trips')        await renderTrips();
    if(page==='reservations') await renderReservations();
    if(page==='finance')      await renderFinance();
    if(page==='reports')      await renderReports();
    if(page==='settings')     await renderSettings();
  }catch(err){
    console.error('Erro em', page, err);
    $('#view').innerHTML = `<div class="empty">Erro ao carregar: ${esc(err.message)}</div>`;
  }
}

/* =====================================================================
   DASHBOARD
   ===================================================================== */
async function renderDashboard(){
  const [resRes, tripRes, txRes] = await Promise.all([
    sb.from('reservations').select('id,reservation_status,total_amount,created_at'),
    sb.from('destinations').select('id,is_active'),
    sb.from('financial_transactions').select('type,amount'),
  ]);
  if(resRes.error) console.warn('reservations:', resRes.error);
  if(tripRes.error) console.warn('destinations:', tripRes.error);
  if(txRes.error) console.warn('finance:', txRes.error);

  const reservations = resRes.data || [];
  const trips = tripRes.data || [];
  const txs = txRes.data || [];

  const pending = reservations.filter(r=>r.reservation_status==='pending').length;
  const confirmed = reservations.filter(r=>r.reservation_status==='confirmed').length;
  const activeTrips = trips.filter(t=>t.is_active).length;
  const entradas = txs.filter(t=>t.type==='entrada').reduce((s,t)=>s+Number(t.amount||0),0);
  const despesas = txs.filter(t=>t.type==='despesa').reduce((s,t)=>s+Number(t.amount||0),0);
  const saldo = entradas - despesas;

  $('#view').innerHTML = `
    <div class="cards">
      <div class="card"><div class="label">Total de reservas</div><div class="value">${reservations.length}</div></div>
      <div class="card"><div class="label">Pendentes</div><div class="value warning">${pending}</div></div>
      <div class="card"><div class="label">Confirmadas</div><div class="value success">${confirmed}</div></div>
      <div class="card"><div class="label">Viagens ativas</div><div class="value">${activeTrips}</div></div>
      <div class="card"><div class="label">Entradas</div><div class="value success">${fmtBRL(entradas)}</div></div>
      <div class="card"><div class="label">Despesas</div><div class="value danger">${fmtBRL(despesas)}</div></div>
      <div class="card"><div class="label">Saldo</div><div class="value ${saldo>=0?'success':'danger'}">${fmtBRL(saldo)}</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Últimas reservas</th><th>Status</th><th>Valor</th><th>Data</th></tr></thead>
        <tbody>
          ${reservations.slice(0,5).map(r=>`
            <tr><td>#${String(r.id).slice(0,8)}</td><td><span class="badge ${r.reservation_status}">${r.reservation_status}</span></td><td>${fmtBRL(r.total_amount)}</td><td>${fmtDate(r.created_at)}</td></tr>
          `).join('') || '<tr><td colspan="4" class="empty">Sem reservas ainda.</td></tr>'}
        </tbody>
      </table>
    </div>`;
}

/* =====================================================================
   VIAGENS
   ===================================================================== */
async function renderTrips(){
  $('#page-actions').innerHTML = `<button class="btn btn-primary" id="new-trip-btn">+ Nova viagem</button>`;
  const { data, error } = await sb.from('destinations').select('*').order('created_at',{ascending:false});
  if(error) throw error;
  state.data.trips = data || [];

  $('#view').innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr><th>Imagem</th><th>Destino</th><th>Saída</th><th>Retorno</th><th>Preço</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody>
        ${state.data.trips.map(t=>`
          <tr>
            <td>${t.image_url?`<img class="thumb" src="${esc(t.image_url)}" alt="">`:'—'}</td>
            <td>${esc(t.name)}</td>
            <td>${fmtDate(t.departure_date)}</td>
            <td>${fmtDate(t.return_date)}</td>
            <td>${fmtBRL(t.price)}</td>
            <td><span class="badge ${t.is_active?'published':'unpublished'}">${t.is_active?'Publicado':'Não publicado'}</span></td>
            <td class="row-actions">
              <button class="btn btn-ghost btn-sm" data-act="edit" data-id="${t.id}">Editar</button>
              <button class="btn btn-ghost btn-sm" data-act="toggle" data-id="${t.id}">${t.is_active?'Despublicar':'Publicar'}</button>
              <button class="btn btn-danger btn-sm" data-act="del" data-id="${t.id}">Excluir</button>
            </td>
          </tr>`).join('') || '<tr><td colspan="7" class="empty">Nenhuma viagem cadastrada.</td></tr>'}
      </tbody>
    </table></div>`;

  $('#new-trip-btn')?.addEventListener('click', ()=> openTripForm());
  $('#view').querySelectorAll('[data-act]').forEach(btn=>{
    const id = btn.dataset.id, act = btn.dataset.act;
    btn.onclick = async ()=>{
      if(act==='edit') openTripForm(id);
      if(act==='toggle') await toggleTrip(id);
      if(act==='del') await deleteTrip(id);
    };
  });
}

function openTripForm(id=null){
  const trip = id ? state.data.trips.find(t=>t.id===id) : null;
  openModal(trip?'Editar viagem':'Nova viagem', `
    <div class="field"><label>Nome do destino</label><input id="f-name" value="${esc(trip?.name||'')}"></div>
    <div class="field"><label>Descrição</label><textarea id="f-desc" rows="3">${esc(trip?.description||'')}</textarea></div>
    <div class="form-row">
      <div class="field"><label>Data de saída</label><input type="date" id="f-dep" value="${trip?.departure_date||''}"></div>
      <div class="field"><label>Data de retorno</label><input type="date" id="f-ret" value="${trip?.return_date||''}"></div>
    </div>
    <div class="field"><label>Preço por pessoa (R$)</label><input type="number" step="0.01" id="f-price" value="${trip?.price||''}"></div>
    <div class="field"><label>Imagem (${trip?.image_url?'substituir':'enviar'})</label><input type="file" id="f-img" accept="image/*"></div>
    <div class="error-msg" id="form-error"></div>
  `, `
    <button class="btn btn-ghost" id="cancel-form">Cancelar</button>
    <button class="btn btn-primary" id="save-form">Salvar</button>
  `);
  $('#cancel-form').onclick = closeModal;
  $('#save-form').onclick = ()=> saveTrip(trip?.id||null);
}

async function saveTrip(id){
  const errEl = $('#form-error');
  errEl.textContent = '';
  const name = $('#f-name').value.trim();
  const description = $('#f-desc').value.trim();
  const departure_date = $('#f-dep').value || null;
  const return_date = $('#f-ret').value || null;
  const price = parseFloat($('#f-price').value || 0);
  const file = $('#f-img').files[0];

  if(!name){ errEl.textContent = 'Informe o nome do destino.'; return; }
  if(!price || price<=0){ errEl.textContent = 'Informe um preço válido.'; return; }
  if(file){
    if(!file.type.startsWith('image/')){ errEl.textContent = 'Arquivo precisa ser imagem.'; return; }
    if(file.size > 5*1024*1024){ errEl.textContent = 'Imagem maior que 5MB.'; return; }
  }

  let image_url = id ? state.data.trips.find(t=>t.id===id)?.image_url : null;
  if(file){
    const path = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.\-_]/g,'')}`;
    const { error: upErr } = await sb.storage.from(BUCKET_IMAGES).upload(path, file);
    if(upErr){ errEl.textContent = 'Erro no upload: '+upErr.message; return; }
    const { data: pub } = sb.storage.from(BUCKET_IMAGES).getPublicUrl(path);
    image_url = pub.publicUrl;
  }

  const payload = { name, description, departure_date, return_date, price, image_url, updated_at: new Date().toISOString() };
  let res;
  if(id){
    res = await sb.from('destinations').update(payload).eq('id', id);
    await logActivity('update_trip', `Viagem ${id} atualizada`);
  }else{
    payload.is_active = false;
    payload.created_at = new Date().toISOString();
    res = await sb.from('destinations').insert(payload);
    await logActivity('create_trip', `Viagem "${name}" criada`);
  }
  if(res.error){ errEl.textContent = 'Erro ao salvar: '+res.error.message; return; }
  closeModal();
  toast('Viagem salva.','success');
  renderTrips();
}

async function toggleTrip(id){
  const trip = state.data.trips.find(t=>t.id===id);
  const { error } = await sb.from('destinations').update({ is_active: !trip.is_active }).eq('id', id);
  if(error){ toast('Erro: '+error.message,'error'); return; }
  await logActivity('toggle_trip', `Viagem ${id} ${trip.is_active?'despublicada':'publicada'}`);
  toast(trip.is_active?'Despublicada.':'Publicada.','success');
  renderTrips();
}

async function deleteTrip(id){
  if(!confirm('Excluir esta viagem?')) return;
  const { error } = await sb.from('destinations').delete().eq('id', id);
  if(error){
    if(error.message.includes('foreign key') || error.code === '23503'){
      toast('Não é possível excluir: há reservas vinculadas a esta viagem.','error');
    } else {
      toast('Erro: '+error.message,'error');
    }
    return;
  }
  await logActivity('delete_trip', `Viagem ${id} excluída`);
  toast('Viagem excluída.','success');
  renderTrips();
}

/* =====================================================================
   RESERVAS
   ===================================================================== */
async function renderReservations(){
  const { data, error } = await sb
    .from('reservations')
    .select('*, destinations(name)')
    .order('created_at',{ascending:false});
  if(error) throw error;
  state.data.reservations = data || [];

  $('#view').innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr><th>Cliente</th><th>Telefone</th><th>Viagem</th><th>Pax</th><th>Valor</th><th>Status</th><th>Data</th><th>Ações</th></tr></thead>
      <tbody>
        ${state.data.reservations.map(r=>`
          <tr>
            <td>${esc(r.customer_name)}</td>
            <td>${esc(r.phone||'—')}</td>
            <td>${esc(r.destinations?.name||'—')}</td>
            <td>${r.passengers}</td>
            <td>${fmtBRL(r.total_amount)}</td>
            <td><span class="badge ${r.reservation_status}">${r.reservation_status}</span></td>
            <td>${fmtDate(r.created_at)}</td>
            <td class="row-actions">
              <button class="btn btn-ghost btn-sm" data-act="status" data-id="${r.id}">Status</button>
              <button class="btn btn-ghost btn-sm" data-act="whats" data-id="${r.id}">WhatsApp</button>
              <button class="btn btn-danger btn-sm" data-act="del" data-id="${r.id}">Excluir</button>
            </td>
          </tr>`).join('') || '<tr><td colspan="8" class="empty">Sem reservas.</td></tr>'}
      </tbody>
    </table></div>`;

  $('#view').querySelectorAll('[data-act]').forEach(btn=>{
    const id = btn.dataset.id, act = btn.dataset.act;
    btn.onclick = ()=>{
      if(act==='status') changeReservationStatus(id);
      if(act==='whats') openWhatsApp(id);
      if(act==='del') deleteReservation(id);
    };
  });
}

function changeReservationStatus(id){
  const r = state.data.reservations.find(x=>x.id===id);
  openModal('Alterar status', `
    <div class="field"><label>Status</label>
      <select id="f-status">
        <option value="pending" ${r.reservation_status==='pending'?'selected':''}>Pendente</option>
        <option value="confirmed" ${r.reservation_status==='confirmed'?'selected':''}>Confirmada</option>
        <option value="cancelled" ${r.reservation_status==='cancelled'?'selected':''}>Cancelada</option>
      </select>
    </div>
  `, `
    <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" id="save-status">Salvar</button>
  `);
  $('#save-status').onclick = async ()=>{
    const status = $('#f-status').value;
    const { error } = await sb.from('reservations').update({ reservation_status: status }).eq('id', id);
    if(error){ toast('Erro: '+error.message,'error'); return; }
    await logActivity('update_reservation_status', `Reserva ${id} → ${status}`);
    closeModal();
    toast('Status atualizado.','success');
    renderReservations();
  };
}

function openWhatsApp(id){
  const r = state.data.reservations.find(x=>x.id===id);
  const phone = (r.phone||'').replace(/\D/g,'');
  if(!phone){ toast('Cliente sem telefone cadastrado.','error'); return; }
  const msg = encodeURIComponent(`Olá ${r.customer_name}, sobre sua reserva #${String(r.id).slice(0,8)} para ${r.destinations?.name||'a viagem'}.`);
  window.open(`https://wa.me/55${phone}?text=${msg}`,'_blank');
}

async function deleteReservation(id){
  if(!confirm('Excluir esta reserva?')) return;
  const { error } = await sb.from('reservations').delete().eq('id', id);
  if(error){ toast('Erro: '+error.message,'error'); return; }
  await logActivity('delete_reservation', `Reserva ${id} excluída`);
  toast('Reserva excluída.','success');
  renderReservations();
}

/* =====================================================================
   FINANCEIRO
   ===================================================================== */
async function renderFinance(){
  $('#page-actions').innerHTML = `<button class="btn btn-primary" id="new-tx-btn">+ Lançamento</button>`;
  const [txRes, tripRes] = await Promise.all([
    sb.from('financial_transactions').select('*, destinations(name)').order('transaction_date',{ascending:false}),
    sb.from('destinations').select('id,name').order('name'),
  ]);
  if(txRes.error) throw txRes.error;
  const txs = txRes.data || [];
  state.data.transactions = txs;
  state.data.tripList = tripRes.data || [];

  const entradas = txs.filter(t=>t.type==='entrada').reduce((s,t)=>s+Number(t.amount||0),0);
  const despesas = txs.filter(t=>t.type==='despesa').reduce((s,t)=>s+Number(t.amount||0),0);

  $('#view').innerHTML = `
    <div class="cards">
      <div class="card"><div class="label">Entradas</div><div class="value success">${fmtBRL(entradas)}</div></div>
      <div class="card"><div class="label">Despesas</div><div class="value danger">${fmtBRL(despesas)}</div></div>
      <div class="card"><div class="label">Saldo</div><div class="value ${entradas-despesas>=0?'success':'danger'}">${fmtBRL(entradas-despesas)}</div></div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Viagem</th><th>Valor</th><th>Ações</th></tr></thead>
      <tbody>
        ${txs.map(t=>`
          <tr>
            <td>${fmtDate(t.transaction_date)}</td>
            <td><span class="badge ${t.type==='entrada'?'confirmed':'cancelled'}">${t.type}</span></td>
            <td>${esc(t.description)}</td>
            <td>${esc(t.destinations?.name||'—')}</td>
            <td>${fmtBRL(t.amount)}</td>
            <td><button class="btn btn-danger btn-sm" data-act="del-tx" data-id="${t.id}">Excluir</button></td>
          </tr>`).join('') || '<tr><td colspan="6" class="empty">Sem lançamentos.</td></tr>'}
      </tbody>
    </table></div>`;

  $('#new-tx-btn')?.addEventListener('click', openTxForm);
  $('#view').querySelectorAll('[data-act="del-tx"]').forEach(btn=>{
    btn.onclick = ()=> deleteTx(btn.dataset.id);
  });
}

function openTxForm(){
  openModal('Novo lançamento', `
    <div class="field"><label>Tipo</label>
      <select id="tx-type"><option value="entrada">Entrada</option><option value="despesa">Despesa</option></select>
    </div>
    <div class="field"><label>Descrição</label><input id="tx-desc"></div>
    <div class="field"><label>Valor (R$)</label><input type="number" step="0.01" id="tx-amount"></div>
    <div class="field"><label>Data</label><input type="date" id="tx-date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Viagem (opcional)</label>
      <select id="tx-trip"><option value="">—</option>${state.data.tripList.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>
    </div>
    <div class="error-msg" id="tx-error"></div>
  `, `
    <button class="btn btn-ghost" id="tx-cancel">Cancelar</button>
    <button class="btn btn-primary" id="tx-save">Salvar</button>
  `);
  $('#tx-cancel').onclick = closeModal;
  $('#tx-save').onclick = async ()=>{
    const type = $('#tx-type').value;
    const description = $('#tx-desc').value.trim();
    const amount = parseFloat($('#tx-amount').value||0);
    const transaction_date = $('#tx-date').value;
    const destination_id = $('#tx-trip').value || null;
    if(!description || amount<=0 || !transaction_date){ $('#tx-error').textContent='Preencha todos os campos.'; return; }
    const { error } = await sb.from('financial_transactions').insert({ type, description, amount, transaction_date, destination_id });
    if(error){ $('#tx-error').textContent = error.message; return; }
    await logActivity('create_tx', `${type} ${fmtBRL(amount)} — ${description}`);
    closeModal();
    toast('Lançamento registrado.','success');
    renderFinance();
  };
}

async function deleteTx(id){
  if(!confirm('Excluir este lançamento?')) return;
  const { error } = await sb.from('financial_transactions').delete().eq('id', id);
  if(error){ toast('Erro: '+error.message,'error'); return; }
  await logActivity('delete_tx', `Lançamento ${id} excluído`);
  toast('Lançamento excluído.','success');
  renderFinance();
}

/* =====================================================================
   RELATÓRIOS
   ===================================================================== */
async function renderReports(){
  const [txRes, tripRes] = await Promise.all([
    sb.from('financial_transactions').select('*, destinations(name)').order('transaction_date',{ascending:false}),
    sb.from('destinations').select('id,name').order('name'),
  ]);
  if(txRes.error) throw txRes.error;
  const txs = txRes.data || [];
  const trips = tripRes.data || [];
  state.data.transactions = txs;
  state.data.tripList = trips;

  $('#view').innerHTML = `
    <div class="cards" style="grid-template-columns:1fr 1fr 1fr">
      <div class="field"><label>De</label><input type="date" id="rep-from"></div>
      <div class="field"><label>Até</label><input type="date" id="rep-to"></div>
      <div class="field"><label>Viagem</label>
        <select id="rep-trip"><option value="">Todas</option>${trips.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>
      </div>
    </div>
    <div style="display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap">
      <button class="btn btn-primary btn-sm" id="rep-filter">Filtrar</button>
      <button class="btn btn-ghost btn-sm" id="rep-csv">Exportar CSV</button>
      <button class="btn btn-ghost btn-sm" id="rep-pdf">Gerar PDF</button>
    </div>
    <div id="rep-results"></div>`;

  const renderResults = (filtered)=>{
    const entradas = filtered.filter(t=>t.type==='entrada').reduce((s,t)=>s+Number(t.amount||0),0);
    const despesas = filtered.filter(t=>t.type==='despesa').reduce((s,t)=>s+Number(t.amount||0),0);
    $('#rep-results').innerHTML = `
      <div class="cards">
        <div class="card"><div class="label">Entradas</div><div class="value success">${fmtBRL(entradas)}</div></div>
        <div class="card"><div class="label">Despesas</div><div class="value danger">${fmtBRL(despesas)}</div></div>
        <div class="card"><div class="label">Saldo</div><div class="value">${fmtBRL(entradas-despesas)}</div></div>
        <div class="card"><div class="label">Lançamentos</div><div class="value">${filtered.length}</div></div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Viagem</th><th>Valor</th></tr></thead>
        <tbody>${filtered.map(t=>`<tr><td>${fmtDate(t.transaction_date)}</td><td>${t.type}</td><td>${esc(t.description)}</td><td>${esc(t.destinations?.name||'—')}</td><td>${fmtBRL(t.amount)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Sem dados.</td></tr>'}</tbody>
      </table></div>`;
  };

  let current = [...txs];
  renderResults(current);

  $('#rep-filter').onclick = ()=>{
    const from = $('#rep-from').value, to = $('#rep-to').value, trip = $('#rep-trip').value;
    current = txs.filter(t=>{
      if(from && t.transaction_date < from) return false;
      if(to && t.transaction_date > to) return false;
      if(trip && String(t.destination_id)!==trip) return false;
      return true;
    });
    renderResults(current);
  };

  $('#rep-csv').onclick = ()=>{
    const rows = [['Data','Tipo','Descrição','Viagem','Valor']];
    current.forEach(t=>rows.push([t.transaction_date,t.type,t.description,t.destinations?.name||'',t.amount]));
    const csv = rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `relatorio-${Date.now()}.csv`;
    a.click();
  };

  $('#rep-pdf').onclick = ()=>{
    const w = window.open('','_blank');
    if(!w){ toast('Popup bloqueado. Permita popups.','error'); return; }
    w.document.write(`<html><head><title>Relatório</title><style>body{font-family:sans-serif;padding:2rem}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:.4rem;font-size:.85rem}th{background:#eee}</style></head><body>
      <h2>Relatório Financeiro</h2><p>Gerado em ${new Date().toLocaleString('pt-BR')}</p>
      <table><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th>Viagem</th><th>Valor</th></tr></thead>
      <tbody>${current.map(t=>`<tr><td>${fmtDate(t.transaction_date)}</td><td>${t.type}</td><td>${esc(t.description)}</td><td>${esc(t.destinations?.name||'')}</td><td>${fmtBRL(t.amount)}</td></tr>`).join('')}</tbody></table>
      </body></html>`);
    w.document.close();
    w.print();
  };
}

async function renderSettings(){
  const { data, error } = await sb.from('admin_users').select('id,user_id,role,created_at');
  if(error) throw error;
  state.data.admins = data || [];

  $('#view').innerHTML = `
    <div class="cards">
      <div class="card"><div class="label">Seu papel</div><div class="value" style="font-size:1.1rem">${state.role}</div></div>
      <div class="card"><div class="label">Permissões</div><div class="value" style="font-size:.85rem;font-weight:400">${state.permissions.join(', ')}</div></div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>User ID</th><th>Papel</th><th>Criado em</th>${can('manage_users')?'<th>Ações</th>':''}</tr></thead>
      <tbody>
        ${state.data.admins.map(a=>`
          <tr>
            <td style="font-family:monospace;font-size:.75rem">${esc(a.user_id)}</td>
            <td>${esc(a.role)}</td>
            <td>${fmtDate(a.created_at)}</td>
            ${can('manage_users')?`<td><button class="btn btn-danger btn-sm" data-del-admin="${a.id}">Remover</button></td>`:''}
          </tr>`).join('') || '<tr><td colspan="4" class="empty">Nenhum admin.</td></tr>'}
      </tbody>
    </table></div>
    <p style="margin-top:1rem;color:var(--muted);font-size:.8rem">Para adicionar admin: crie em Authentication → Users, depois <code>insert into admin_users(user_id,role) values ('&lt;uuid&gt;','owner');</code></p>`;

  $('#view').querySelectorAll('[data-del-admin]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm('Remover este administrador?')) return;
      const { error } = await sb.from('admin_users').delete().eq('id', btn.dataset.delAdmin);
      if(error){ toast('Erro: '+error.message,'error'); return; }
      await logActivity('remove_admin', 'Administrador removido');
      toast('Admin removido.','success');
      renderSettings();
    };
  });
}

/* =====================================================================
   BOOT — restaura sessão se já logado
   ===================================================================== */
(async ()=>{
  try {
    const { data:{ user }, error } = await sb.auth.getUser();
    if(error || !user) return;

    const { data: adminRow, error: adminError } = await sb
      .from('admin_users').select('role').eq('user_id', user.id).maybeSingle();

    if(adminError || !adminRow) return;

    const perms = ROLE_PERMISSIONS[adminRow.role];
    if(!perms) return;

    state.user = user;
    state.role = adminRow.role;
    state.permissions = perms;

    $('#login-screen').style.display = 'none';
    $('#app').style.display = 'block';
    $('#user-email').textContent = user.email;
    $('#user-role').textContent = adminRow.role;
    renderNav();
    navigate('dashboard');
  } catch (err) {
    console.warn('boot:', err);
  }
})();

$('#mobile-menu-btn').onclick = ()=> $('#sidebar').classList.toggle('open');
