<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel Administrativo — MS Turismo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --blue-50:#eff6ff;
    --blue-100:#dbeafe;
    --blue-200:#bfdbfe;
    --blue-500:#3b82f6;
    --blue-600:#2563eb;
    --blue-700:#1d4ed8;
    --white:#ffffff;
    --bg:#f4f7fb;
    --panel:#ffffff;
    --text:#0f172a;
    --muted:#64748b;
    --border:#e2e8f0;
    --success:#10b981;
    --warning:#f59e0b;
    --danger:#ef4444;
    --radius:14px;
    --radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06);
    --shadow:0 4px 20px rgba(15,23,42,.08);
    --shadow-lg:0 20px 50px rgba(15,23,42,.12);
    --sidebar-w:260px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Poppins',sans-serif;font-weight:600;letter-spacing:-.2px}
  button{cursor:pointer;font-family:inherit}
  input,select,textarea{font-family:inherit}
  a{color:var(--blue-600);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ========== LOGIN ========== */
  #login-screen{
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:1.25rem;
    background:
      radial-gradient(circle at 10% 10%, var(--blue-100) 0%, transparent 45%),
      radial-gradient(circle at 90% 90%, #e0f2fe 0%, transparent 45%),
      var(--bg);
  }
  .login-card{
    background:var(--white);
    padding:2.25rem 2rem;
    border-radius:18px;
    box-shadow:var(--shadow-lg);
    width:100%;max-width:400px;
    border:1px solid var(--border);
  }
  .login-brand{display:flex;align-items:center;gap:.6rem;margin-bottom:1.25rem}
  .login-brand .logo{
    width:42px;height:42px;border-radius:12px;
    background:linear-gradient(135deg,var(--blue-500),var(--blue-700));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:1.1rem;
    box-shadow:0 6px 16px rgba(37,99,235,.35);
  }
  .login-brand strong{font-family:'Poppins',sans-serif;font-size:1.05rem}
  .login-brand small{display:block;color:var(--muted);font-size:.75rem;font-weight:400}
  .login-card h1{font-size:1.35rem;margin-bottom:.25rem}
  .login-card > p{color:var(--muted);font-size:.85rem;margin-bottom:1.5rem}

  .field{margin-bottom:1rem}
  .field label{display:block;font-size:.8rem;color:var(--text);font-weight:500;margin-bottom:.4rem}
  .field input,.field select,.field textarea{
    width:100%;padding:.7rem .85rem;
    background:var(--white);
    border:1.5px solid var(--border);
    border-radius:var(--radius-sm);
    color:var(--text);font-size:.9rem;
    transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;border-color:var(--blue-500);
    box-shadow:0 0 0 3px rgba(59,130,246,.15);
  }

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
    padding:.7rem 1.1rem;border:none;border-radius:var(--radius-sm);
    font-weight:600;font-size:.9rem;transition:.15s;white-space:nowrap;
  }
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .btn-primary{background:var(--blue-600);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.25)}
  .btn-primary:hover:not(:disabled){background:var(--blue-700)}
  .btn-ghost{background:var(--white);color:var(--text);border:1.5px solid var(--border)}
  .btn-ghost:hover:not(:disabled){border-color:var(--blue-200);background:var(--blue-50)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-danger:hover:not(:disabled){background:#dc2626}
  .btn-sm{padding:.45rem .75rem;font-size:.8rem;border-radius:8px}
  .btn-block{width:100%}

  .error-msg{color:var(--danger);font-size:.8rem;margin-top:.5rem;min-height:1.1rem;word-break:break-word}

  /* ========== APP LAYOUT ========== */
  #app{display:none;min-height:100vh}
  .layout{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}

  aside{
    background:var(--white);
    border-right:1px solid var(--border);
    padding:1.25rem 1rem;
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
    z-index:30;
  }
  .brand{
    display:flex;align-items:center;gap:.6rem;
    padding:0 .25rem 1rem;
    border-bottom:1px solid var(--border);
    margin-bottom:1rem;
  }
  .brand .logo{
    width:40px;height:40px;border-radius:11px;
    background:linear-gradient(135deg,var(--blue-500),var(--blue-700));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:1rem;flex-shrink:0;
    box-shadow:0 6px 16px rgba(37,99,235,.3);
  }
  .brand strong{font-family:'Poppins',sans-serif;font-size:.95rem;line-height:1.2}
  .brand small{display:block;color:var(--muted);font-size:.7rem;font-weight:400}

  nav{display:flex;flex-direction:column;gap:.25rem;flex:1;overflow-y:auto}
  .nav-item{
    display:flex;align-items:center;gap:.75rem;
    padding:.65rem .85rem;border-radius:10px;
    color:var(--muted);background:transparent;border:none;
    text-align:left;font-size:.88rem;font-weight:500;width:100%;
    transition:.15s;
  }
  .nav-item .icon{
    width:22px;text-align:center;font-size:.95rem;
    display:flex;align-items:center;justify-content:center;
  }
  .nav-item:hover{background:var(--blue-50);color:var(--blue-700)}
  .nav-item.active{background:var(--blue-600);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.25)}
  .nav-item.active .icon{color:#fff}

  .user-box{
    padding:1rem .25rem 0;
    border-top:1px solid var(--border);
    margin-top:.75rem;
    font-size:.8rem;
  }
  .user-box .email{font-weight:600;color:var(--text);word-break:break-all;font-size:.82rem}
  .user-box .role{
    display:inline-block;margin-top:.35rem;
    background:var(--blue-50);color:var(--blue-700);
    font-size:.68rem;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;
    padding:.2rem .55rem;border-radius:999px;
  }
  .user-box button{margin-top:.75rem;width:100%}

  main{padding:1.75rem 2rem;overflow:auto;min-width:0}

  .page-header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:1.5rem;flex-wrap:wrap;gap:.75rem;
  }
  .page-header .left{display:flex;align-items:center;gap:.75rem;min-width:0}
  .page-header h2{font-size:1.5rem;line-height:1.2}
  .page-header .sub{color:var(--muted);font-size:.85rem;margin-top:.15rem}
  #page-actions{display:flex;gap:.5rem;flex-wrap:wrap}

  .mobile-menu-btn{
    display:none;
    background:var(--white);border:1.5px solid var(--border);
    color:var(--text);padding:0;width:40px;height:40px;
    border-radius:10px;align-items:center;justify-content:center;
    font-size:1rem;flex-shrink:0;
  }
  .mobile-menu-btn:hover{border-color:var(--blue-200);background:var(--blue-50)}

  /* ========== CARDS ========== */
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:1rem;margin-bottom:1.75rem;
  }
  .card{
    background:var(--white);border:1px solid var(--border);
    border-radius:var(--radius);padding:1.15rem 1.25rem;
    box-shadow:var(--shadow-sm);
    transition:transform .15s, box-shadow .15s;
  }
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .card .label{
    font-size:.72rem;color:var(--muted);
    text-transform:uppercase;letter-spacing:.06em;
    font-weight:600;
  }
  .card .value{font-family:'Poppins',sans-serif;font-size:1.75rem;font-weight:700;margin-top:.4rem;color:var(--text)}
  .card .value.success{color:var(--success)}
  .card .value.danger{color:var(--danger)}
  .card .value.warning{color:var(--warning)}
  .card .value.blue{color:var(--blue-600)}

  /* ========== TABELAS ========== */
  .table-wrap{
    background:var(--white);border:1px solid var(--border);
    border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow-sm);
  }
  .table-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:640px}
  th,td{padding:.85rem 1rem;text-align:left;border-bottom:1px solid var(--border)}
  th{
    background:var(--blue-50);
    font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;
    color:var(--blue-700);font-weight:700;
  }
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fafcff}

  .badge{
    display:inline-block;padding:.22rem .6rem;border-radius:999px;
    font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  }
  .badge.published{background:var(--blue-100);color:var(--blue-700)}
  .badge.pending{background:#fef3c7;color:#92400e}
  .badge.confirmed{background:#d1fae5;color:#065f46}
  .badge.cancelled{background:#fee2e2;color:#991b1b}

  .row-actions{display:flex;gap:.35rem;flex-wrap:wrap}
  .thumb{width:52px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}

  /* ========== CARDS DE GRUPO (RESERVAS POR DESTINO) ========== */
  .group-card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow-sm);
    margin-bottom:1.25rem;
    overflow:hidden;
  }
  .group-head{
    display:flex;justify-content:space-between;align-items:center;
    gap:1rem;flex-wrap:wrap;
    padding:1rem 1.25rem;
    background:linear-gradient(90deg,var(--blue-50),var(--white));
    border-bottom:1px solid var(--border);
  }
  .group-title{display:flex;align-items:center;gap:.85rem;min-width:0}
  .group-icon{
    width:44px;height:44px;border-radius:12px;
    background:linear-gradient(135deg,var(--blue-500),var(--blue-700));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:1rem;flex-shrink:0;
    box-shadow:0 4px 12px rgba(37,99,235,.25);
  }
  .group-title h3{font-size:1.05rem;line-height:1.2;color:var(--text)}
  .group-title span{font-size:.78rem;color:var(--muted)}
  .group-card .table-scroll{overflow-x:auto}
  .group-card table{min-width:600px}

  /* ========== MODAL ========== */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(15,23,42,.45);
    backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;
    padding:1rem;z-index:50;
  }
  .modal-backdrop.open{display:flex;animation:fadeIn .18s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{
    background:var(--white);border-radius:16px;
    width:100%;max-width:560px;max-height:90vh;overflow:auto;
    box-shadow:var(--shadow-lg);
    animation:pop .2s ease;
  }
  @keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-header{
    padding:1.1rem 1.35rem;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;
    position:sticky;top:0;background:var(--white);z-index:2;
    border-radius:16px 16px 0 0;
  }
  .modal-header h3{font-size:1rem}
  .modal-body{padding:1.35rem}
  .modal-footer{
    padding:1rem 1.35rem;border-top:1px solid var(--border);
    display:flex;justify-content:flex-end;gap:.5rem;
  }
  .close-x{
    background:transparent;border:none;color:var(--muted);
    font-size:1.4rem;line-height:1;width:34px;height:34px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
  }
  .close-x:hover{background:var(--bg);color:var(--text)}

  /* ========== TOAST ========== */
  #toast-container{
    position:fixed;top:1rem;right:1rem;
    display:flex;flex-direction:column;gap:.5rem;z-index:100;
    pointer-events:none;
  }
  .toast{
    padding:.8rem 1.1rem;border-radius:10px;font-size:.85rem;font-weight:500;
    color:#fff;box-shadow:var(--shadow);animation:slideIn .25s ease;
    pointer-events:auto;max-width:340px;
  }
  .toast.success{background:var(--success)}
  .toast.error{background:var(--danger)}
  .toast.info{background:var(--blue-600)}
  @keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

  .empty{
    text-align:center;padding:2.5rem 1rem;
    color:var(--muted);font-size:.9rem;
  }
  .empty i{font-size:2rem;color:var(--blue-200);display:block;margin-bottom:.5rem}

  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}

  /* ========== RESPONSIVO ========== */
  .sidebar-backdrop{
    display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);
    z-index:25;
  }
  @media(max-width:900px){
    .layout{grid-template-columns:1fr}
    aside{
      position:fixed;left:calc(-1 * var(--sidebar-w) - 20px);top:0;bottom:0;
      width:var(--sidebar-w);transition:left .25s ease;
      box-shadow:var(--shadow-lg);
    }
    aside.open{left:0}
    .sidebar-backdrop.open{display:block}
    main{padding:1.15rem}
    .mobile-menu-btn{display:flex}
    .page-header h2{font-size:1.25rem}
    .form-row{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .cards{grid-template-columns:1fr 1fr;gap:.75rem}
    .card{padding:.9rem 1rem}
    .card .value{font-size:1.4rem}
    main{padding:1rem .85rem}
    .page-header{margin-bottom:1.1rem}
    .page-header h2{font-size:1.15rem}
    #toast-container{left:.75rem;right:.75rem;top:.75rem}
    .toast{max-width:none}
    .group-head{padding:.85rem 1rem}
    .group-title h3{font-size:.95rem}
  }
</style>
</head>
<body>

<!-- ========== LOGIN ========== -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo"><i class="fas fa-bus"></i></div>
      <div>
        <strong>MS Turismo</strong>
        <small>Painel Administrativo</small>
      </div>
    </div>
    <h1>Bem-vindo de volta</h1>
    <p>Acesse com suas credenciais autorizadas.</p>
    <form id="login-form">
      <div class="field">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" required autocomplete="username" placeholder="voce@email.com" />
      </div>
      <div class="field">
        <label for="login-password">Senha</label>
        <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">
        <i class="fas fa-right-to-bracket"></i> Entrar
      </button>
      <div class="error-msg" id="login-error"></div>
    </form>
  </div>
</div>

<!-- ========== APP ========== -->
<div id="app">
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <div class="layout">
    <aside id="sidebar">
      <div class="brand">
        <div class="logo"><i class="fas fa-bus"></i></div>
        <div>
          <strong>MS Turismo</strong>
          <small>Administração</small>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="user-box">
        <div class="email" id="user-email">—</div>
        <div class="role" id="user-role">—</div>
        <button class="btn btn-ghost btn-sm" id="logout-btn">
          <i class="fas fa-right-from-bracket"></i> Sair
        </button>
      </div>
    </aside>
    <main>
      <div class="page-header">
        <div class="left">
          <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Abrir menu">
            <i class="fas fa-bars"></i>
          </button>
          <div>
            <h2 id="page-title">Dashboard</h2>
            <div class="sub" id="page-sub">Visão geral</div>
          </div>
        </div>
        <div id="page-actions"></div>
      </div>
      <div id="view"></div>
    </main>
  </div>
</div>

<!-- ========== MODAL ========== -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">—</h3>
      <button class="close-x" id="modal-close" aria-label="Fechar"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<div id="toast-container"></div>

<script>
/* =====================================================================
   CONFIGURAÇÃO
   ===================================================================== */
const SUPABASE_URL = 'https://xskuytsfwplrqhldwhhe.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhza3V5dHNmd3BscnFobGR3aGhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzMzg1NjIsImV4cCI6MjEwOTkxNDU2Mn0.yU582BL2vQRriWN4wiQLcQ07KiRjMJAOtnjPEykcwjc';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const state = { user:null, role:null, permissions:[], currentPage:'dashboard', data:{} };

/* =====================================================================
   PERMISSÕES
   ===================================================================== */
const ROLE_PERMISSIONS = {
  owner:       ['dashboard','trips','reservations','finance','reports','settings','manage_users'],
  admin:       ['dashboard','trips','reservations','finance','reports','settings'],
  financeiro:  ['dashboard','finance','reports'],
  visualizador:['dashboard','trips','reservations','reports'],
};

const MENU = [
  { key:'dashboard',    label:'Dashboard', icon:'fa-chart-line',      title:'Dashboard', sub:'Visão geral' },
  { key:'trips',        label:'Viagens',   icon:'fa-route',           title:'Viagens',   sub:'Destinos cadastrados' },
  { key:'reservations', label:'Reservas',  icon:'fa-clipboard-list',  title:'Reservas',  sub:'Solicitações de clientes' },
];

/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = sel => document.querySelector(sel);
const fmtBRL = n => Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtDate = d => d ? new Date(d).toLocaleDateString('pt-BR') : '—';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<i class="fas ${type==='success'?'fa-circle-check':type==='error'?'fa-circle-exclamation':'fa-circle-info'}"></i> ${esc(msg)}`;
  $('#toast-container').appendChild(el);
  setTimeout(()=>el.remove(), 4000);
}
function can(perm){ return state.permissions.includes(perm); }
function openModal(title, bodyHTML, footerHTML=''){
  $('#modal-title').textContent = title;
  $('#modal-body').innerHTML = bodyHTML;
  $('#modal-footer').innerHTML = footerHTML;
  $('#modal-backdrop').classList.add('open');
}
function closeModal(){ $('#modal-backdrop').classList.remove('open'); }
window.closeModal = closeModal;

$('#modal-close').onclick = closeModal;
$('#modal-backdrop').addEventListener('click', e=>{ if(e.target.id==='modal-backdrop') closeModal(); });

async function logActivity(action, description){
  try{ await sb.from('activity_logs').insert({ user_id: state.user.id, action, description }); }
  catch(e){ /* tabela pode não existir; ignora */ }
}

/* =====================================================================
   LOGIN
   ===================================================================== */
$('#login-form').addEventListener('submit', async e=>{
  e.preventDefault();
  const errEl = $('#login-error');
  const btn = $('#login-btn');
  errEl.textContent = '';
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entrando…';

  const email = $('#login-email').value.trim();
  const password = $('#login-password').value;

  try {
    const { data: authData, error: authError } = await sb.auth.signInWithPassword({ email, password });

    if (authError) {
      if (authError.message.includes('Invalid login')) errEl.textContent = 'E-mail ou senha incorretos.';
      else if (authError.message.includes('Email not confirmed')) errEl.textContent = 'E-mail não confirmado. Confirme em Authentication → Users.';
      else errEl.textContent = 'Erro no login: ' + authError.message;
      return;
    }

    const { data: adminRow, error: adminError } = await sb
      .from('admin_users').select('role').eq('user_id', authData.user.id).maybeSingle();

    if (adminError) {
      errEl.textContent = 'Erro ao ler admin_users: ' + adminError.message;
      await sb.auth.signOut(); return;
    }
    if (!adminRow) {
      errEl.textContent = 'Usuário autenticado, mas NÃO está em admin_users. Insira: insert into admin_users(user_id,role) values (\'' + authData.user.id + '\',\'owner\');';
      await sb.auth.signOut(); return;
    }

    const perms = ROLE_PERMISSIONS[adminRow.role];
    if (!perms) {
      errEl.textContent = 'Role desconhecida: "' + adminRow.role + '".';
      await sb.auth.signOut(); return;
    }

    state.user = authData.user;
    state.role = adminRow.role;
    state.permissions = perms;

    $('#login-screen').style.display = 'none';
    $('#app').style.display = 'block';
    $('#user-email').textContent = authData.user.email;
    $('#user-role').textContent = adminRow.role;

    renderNav();
    navigate('dashboard');

  } catch (err) {
    errEl.textContent = 'Erro inesperado: ' + err.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Entrar';
  }
});

$('#logout-btn').addEventListener('click', async ()=>{
  await sb.auth.signOut();
  location.reload();
});

/* =====================================================================
   NAVEGAÇÃO
   ===================================================================== */
function renderNav(){
  const nav = $('#nav');
  nav.innerHTML = '';
  MENU.forEach(item=>{
    if(!can(item.key)) return;
    const btn = document.createElement('button');
    btn.className = 'nav-item' + (state.currentPage===item.key?' active':'');
    btn.innerHTML = `<span class="icon"><i class="fas ${item.icon}"></i></span> ${item.label}`;
    btn.onclick = ()=>{ navigate(item.key); closeSidebar(); };
    nav.appendChild(btn);
  });
}

function closeSidebar(){
  $('#sidebar').classList.remove('open');
  $('#sidebar-backdrop').classList.remove('open');
}
$('#mobile-menu-btn').onclick = ()=>{
  $('#sidebar').classList.add('open');
  $('#sidebar-backdrop').classList.add('open');
};
$('#sidebar-backdrop').onclick = closeSidebar;

async function navigate(page){
  if(!can(page)){
    toast('Sem permissão para acessar este módulo.','error');
    page = 'dashboard';
  }
  state.currentPage = page;
  renderNav();
  const item = MENU.find(m=>m.key===page);
  $('#page-title').textContent = item.title;
  $('#page-sub').textContent = item.sub;
  $('#page-actions').innerHTML = '';
  $('#view').innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i>Carregando…</div>';

  try{
    if(page==='dashboard')    await renderDashboard();
    if(page==='trips')        await renderTrips();
    if(page==='reservations') await renderReservations();
  }catch(err){
    console.error('Erro em', page, err);
    $('#view').innerHTML = `<div class="empty"><i class="fas fa-triangle-exclamation"></i>Erro ao carregar: ${esc(err.message)}</div>`;
  }
}

/* =====================================================================
   DASHBOARD
   ===================================================================== */
async function renderDashboard(){
  const [resRes, tripRes] = await Promise.all([
    sb.from('reservas').select('id,nome,destino,assento,pagamento'),
    sb.from('viagens').select('id,nome,data_inicio,data_fim,preco'),
  ]);
  if(resRes.error) console.warn('reservas:', resRes.error);
  if(tripRes.error) console.warn('viagens:', tripRes.error);

  const reservas = resRes.data || [];
  const viagens = tripRes.data || [];

  $('#view').innerHTML = `
    <div class="cards">
      <div class="card">
        <div class="label">Total de reservas</div>
        <div class="value blue">${reservas.length}</div>
      </div>
      <div class="card">
        <div class="label">Viagens cadastradas</div>
        <div class="value">${viagens.length}</div>
      </div>
    </div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead><tr><th>Cliente</th><th>Destino</th><th>Assento</th><th>Pagamento</th></tr></thead>
          <tbody>
            ${reservas.slice(0,5).map(r=>`
              <tr>
                <td>${esc(r.nome)}</td>
                <td>${esc(r.destino||'—')}</td>
                <td>${esc(r.assento??'—')}</td>
                <td>${esc(r.pagamento||'—')}</td>
              </tr>
            `).join('') || '<tr><td colspan="4" class="empty"><i class="fas fa-inbox"></i>Sem reservas ainda.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;
}

/* =====================================================================
   VIAGENS — lista + CRUD
   ===================================================================== */
async function renderTrips(){
  $('#page-actions').innerHTML = `
    <button class="btn btn-primary btn-sm" id="new-trip-btn">
      <i class="fas fa-plus"></i> Nova viagem
    </button>
  `;
  $('#new-trip-btn').onclick = ()=> openTripForm();

  const { data, error } = await sb.from('viagens').select('*').order('data_inicio',{ascending:false});
  if(error) throw error;
  state.data.trips = data || [];

  $('#view').innerHTML = `
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Imagem</th><th>Destino</th><th>Saída</th><th>Retorno</th>
              <th>Preço</th><th>Modalidade</th><th>Ações</th>
            </tr>
          </thead>
          <tbody>
            ${state.data.trips.map(t=>`
              <tr>
                <td>${t.imagem?`<img class="thumb" src="${esc(t.imagem)}" alt="">`:'—'}</td>
                <td>${esc(t.nome)}</td>
                <td>${fmtDate(t.data_inicio)}</td>
                <td>${fmtDate(t.data_fim)}</td>
                <td>${fmtBRL(t.preco)}</td>
                <td><span class="badge published">${esc(t.modalidade||'Excursão')}</span></td>
                <td class="row-actions">
                  <button class="btn btn-ghost btn-sm" data-act="edit" data-id="${t.id}">
                    <i class="fas fa-pen"></i> Editar
                  </button>
                  <button class="btn btn-danger btn-sm" data-act="del" data-id="${t.id}">
                    <i class="fas fa-trash"></i> Excluir
                  </button>
                </td>
              </tr>`).join('') || '<tr><td colspan="7" class="empty"><i class="fas fa-route"></i>Nenhuma viagem cadastrada.</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>`;

  $('#view').querySelectorAll('[data-act]').forEach(btn=>{
    const id = btn.dataset.id, act = btn.dataset.act;
    btn.onclick = ()=>{
      if(act==='edit') openTripForm(id);
      if(act==='del') deleteTrip(id);
    };
  });
}

/* ---------- Formulário de viagem (criar / editar) ---------- */
function openTripForm(id=null){
  const trip = id ? state.data.trips.find(t=>String(t.id)===String(id)) : null;

  openModal(trip ? 'Editar viagem' : 'Nova viagem', `
    <div class="field">
      <label>Nome do destino *</label>
      <input id="f-name" value="${esc(trip?.nome||'')}" placeholder="Ex.: Dunas de Natal">
    </div>
    <div class="field">
      <label>Descrição</label>
      <textarea id="f-desc" rows="3" placeholder="Breve descrição da viagem">${esc(trip?.descricao||'')}</textarea>
    </div>
    <div class="form-row">
      <div class="field">
        <label>Data de saída</label>
        <input type="date" id="f-dep" value="${trip?.data_inicio||''}">
      </div>
      <div class="field">
        <label>Data de retorno</label>
        <input type="date" id="f-ret" value="${trip?.data_fim||''}">
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label>Preço por pessoa (R$) *</label>
        <input type="number" step="0.01" min="0" id="f-price" value="${trip?.preco||''}" placeholder="0,00">
      </div>
      <div class="field">
        <label>Modalidade</label>
        <select id="f-mod">
          <option value="Excursão" ${trip?.modalidade==='Excursão'?'selected':''}>Excursão</option>
          <option value="Pacote" ${trip?.modalidade==='Pacote'?'selected':''}>Pacote</option>
          <option value="Bate-volta" ${trip?.modalidade==='Bate-volta'?'selected':''}>Bate-volta</option>
          <option value="Cruzeiro" ${trip?.modalidade==='Cruzeiro'?'selected':''}>Cruzeiro</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>URL da imagem (opcional)</label>
      <input id="f-img" value="${esc(trip?.imagem||'')}" placeholder="https://...">
    </div>
    <div class="error-msg" id="form-error"></div>
  `, `
    <button class="btn btn-ghost" id="cancel-form">Cancelar</button>
    <button class="btn btn-primary" id="save-form">
      <i class="fas fa-check"></i> ${trip ? 'Salvar alterações' : 'Cadastrar viagem'}
    </button>
  `);

  $('#cancel-form').onclick = closeModal;
  $('#save-form').onclick = ()=> saveTrip(trip?.id || null);
}

async function saveTrip(id){
  const errEl = $('#form-error');
  errEl.textContent = '';

  const nome        = $('#f-name').value.trim();
  const descricao   = $('#f-desc').value.trim();
  const data_inicio = $('#f-dep').value || null;
  const data_fim    = $('#f-ret').value || null;
  const preco       = parseFloat($('#f-price').value || 0);
  const modalidade  = $('#f-mod').value;
  const imagem      = $('#f-img').value.trim() || null;

  if(!nome){ errEl.textContent = 'Informe o nome do destino.'; return; }
  if(!preco || preco <= 0){ errEl.textContent = 'Informe um preço válido.'; return; }

  const slug = nome.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'');

  const payload = { nome, descricao, data_inicio, data_fim, preco, modalidade, imagem, slug };

  const btn = $('#save-form');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando…';

  let res;
  if(id){
    res = await sb.from('viagens').update(payload).eq('id', id);
  } else {
    res = await sb.from('viagens').insert(payload);
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-check"></i> Salvar';

  if(res.error){
    errEl.textContent = 'Erro ao salvar: ' + res.error.message;
    return;
  }

  closeModal();
  toast(id ? 'Viagem atualizada.' : 'Viagem cadastrada e publicada!','success');
  renderTrips();
}

async function deleteTrip(id){
  if(!confirm('Excluir esta viagem? As reservas vinculadas podem ficar órfãs.')) return;
  const { error } = await sb.from('viagens').delete().eq('id', id);
  if(error){ toast('Erro: '+error.message,'error'); return; }
  toast('Viagem excluída.','success');
  renderTrips();
}

/* =====================================================================
   RESERVAS — agrupadas por destino + exportar CSV
   ===================================================================== */
async function renderReservations(){
  const { data, error } = await sb.from('reservas').select('*');
  if(error) throw error;
  state.data.reservations = data || [];

  const grupos = {};
  state.data.reservations.forEach(r => {
    const chave = (r.destino || 'Sem destino').toString().trim() || 'Sem destino';
    if(!grupos[chave]) grupos[chave] = [];
    grupos[chave].push(r);
  });

  const destinos = Object.keys(grupos).sort((a,b)=>a.localeCompare(b,'pt-BR'));

  $('#page-actions').innerHTML = `
    <button class="btn btn-primary btn-sm" id="export-all">
      <i class="fas fa-file-csv"></i> Baixar todas (${state.data.reservations.length})
    </button>
  `;
  $('#export-all').onclick = ()=> exportarCSV(state.data.reservations, 'todas-reservas');

  if(destinos.length === 0){
    $('#view').innerHTML = `
      <div class="table-wrap">
        <div class="empty"><i class="fas fa-clipboard-list"></i>Sem reservas.</div>
      </div>`;
    return;
  }

  $('#view').innerHTML = destinos.map(destino => {
    const lista = grupos[destino];
    const totalPessoas = lista.length;
    const assentos = lista.map(r=>r.assento).filter(a=>a!=null).sort((a,b)=>a-b).join(', ');

    return `
      <div class="group-card">
        <div class="group-head">
          <div class="group-title">
            <div class="group-icon"><i class="fas fa-map-location-dot"></i></div>
            <div>
              <h3>${esc(destino)}</h3>
              <span>${totalPessoas} reserva${totalPessoas>1?'s':''} · Assentos: ${assentos || '—'}</span>
            </div>
          </div>
          <button class="btn btn-primary btn-sm" data-export="${esc(destino)}">
            <i class="fas fa-download"></i> Baixar lista
          </button>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Cliente</th><th>Telefone</th><th>CPF</th>
                <th>Assento</th><th>Pagamento</th><th>Ações</th>
              </tr>
            </thead>
            <tbody>
              ${lista.map(r=>`
                <tr>
                  <td>${esc(r.nome)}</td>
                  <td>${esc(r.telefone||'—')}</td>
                  <td>${esc(r.cpf||'—')}</td>
                  <td>${esc(r.assento??'—')}</td>
                  <td>${esc(r.pagamento||'—')}</td>
                  <td class="row-actions">
                    <button class="btn btn-ghost btn-sm" data-act="whats" data-id="${r.id}" title="WhatsApp">
                      <i class="fab fa-whatsapp" style="color:#25d366"></i>
                    </button>
                    <button class="btn btn-danger btn-sm" data-act="del" data-id="${r.id}" title="Excluir">
                      <i class="fas fa-trash"></i>
                    </button>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  }).join('');

  $('#view').querySelectorAll('[data-export]').forEach(btn=>{
    btn.onclick = ()=>{
      const destino = btn.dataset.export;
      exportarCSV(grupos[destino], `reservas-${destino}`);
    };
  });

  $('#view').querySelectorAll('[data-act]').forEach(btn=>{
    const id = btn.dataset.id, act = btn.dataset.act;
    btn.onclick = ()=>{
      if(act==='whats') openWhatsApp(id);
      if(act==='del') deleteReservation(id);
    };
  });
}

/* =====================================================================
   EXPORTAR CSV
   ===================================================================== */
function exportarCSV(linhas, nomeArquivo){
  if(!linhas || linhas.length === 0){
    toast('Nada para exportar.','error');
    return;
  }
  const cabecalho = ['Nome','Telefone','CPF','Destino','Assento','Pagamento'];
  const dados = linhas.map(r=>[
    r.nome||'', r.telefone||'', r.cpf||'', r.destino||'', r.assento??'', r.pagamento||''
  ]);
  const csv = [cabecalho, ...dados]
    .map(linha => linha.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';'))
    .join('\r\n');

  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${nomeArquivo}-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Download iniciado.','success');
}

/* =====================================================================
   AÇÕES DA RESERVA
   ===================================================================== */
function openWhatsApp(id){
  const r = state.data.reservations.find(x=>String(x.id)===String(id));
  if(!r) return;
  const phone = (r.telefone||'').replace(/\D/g,'');
  if(!phone){ toast('Cliente sem telefone cadastrado.','error'); return; }
  const msg = encodeURIComponent(`Olá ${r.nome}, sobre sua reserva para ${r.destino||'a viagem'} (assento ${r.assento}).`);
  window.open(`https://wa.me/55${phone}?text=${msg}`,'_blank');
}

async function deleteReservation(id){
  if(!confirm('Excluir esta reserva?')) return;
  const { error } = await sb.from('reservas').delete().eq('id', id);
  if(error){ toast('Erro: '+error.message,'error'); return; }
  toast('Reserva excluída.','success');
  renderReservations();
}

/* =====================================================================
   BOOT
   ===================================================================== */
(async ()=>{
  try {
    const { data:{ user }, error } = await sb.auth.getUser();
    if(error || !user) return;
    const { data: adminRow, error: adminError } = await sb.from('admin_users').select('role').eq('user_id', user.id).maybeSingle();
    if(adminError || !adminRow) return;
    const perms = ROLE_PERMISSIONS[adminRow.role];
    if(!perms) return;

    state.user = user;
    state.role = adminRow.role;
    state.permissions = perms;

    $('#login-screen').style.display = 'none';
    $('#app').style.display = 'block';
    $('#user-email').textContent = user.email;
    $('#user-role').textContent = adminRow.role;
    renderNav();
    navigate('dashboard');
  } catch (err) { console.warn('boot:', err); }
})();
</script>
